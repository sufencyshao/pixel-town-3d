let group='all',active=null,playing=false;const text=v=>Array.isArray(v)?v.join('、'):(v===null||v===undefined?'未指定':String(v));const sex=v=>({male:'男',female:'女',unspecified:'未指定'}[v]||v||'未指定');
function node(tag,className,value){const n=document.createElement(tag);if(className)n.className=className;if(value!==undefined)n.textContent=value;return n}
function portrait(parent,path,name){parent.replaceChildren();if(!path){parent.append(node('span','placeholder','素材准备中'));return}const im=node('img');im.src=path;im.alt=name;im.loading='lazy';im.onerror=()=>parent.replaceChildren(node('span','placeholder','图像暂不可用'));parent.append(im)}
function filterButtons(){const c=$('filters');c.replaceChildren();for(const [key,label]of Object.entries(GROUPS)){let count=key==='all'?DATA.length:DATA.filter(x=>x.group===key).length;const b=node('button','filter'+(group===key?' active':''),label);b.type='button';b.setAttribute('aria-pressed',group===key);b.append(node('span','',count));b.onclick=()=>{group=key;if(key!=='all'&&key!=='animals')$('species').value='';filterButtons();render()};c.append(b)}}
function render(){const q=$('search').value.trim().toLowerCase(),species=$('species').value;const filtered=DATA.filter(x=>(group==='all'||x.group===group)&&(!species||x.profile.animal?.species===species)&&(!q||JSON.stringify(x.profile).toLowerCase().includes(q)));$('results').textContent=`显示 ${filtered.length} / ${DATA.length} 位 · ${GROUPS[group]}${species?' / '+species:''}`;const grid=$('grid');grid.replaceChildren();for(const x of filtered){const p=x.profile,card=node('button','card');card.type='button';card.dataset.group=x.group;card.setAttribute('aria-label',`查看${p.name}的档案与动作`);const box=node('div','portrait');portrait(box,x.portrait,p.name);box.append(node('span','tag',GROUPS[x.group]));const body=node('div','cardbody');body.append(node('h2','',p.name),node('div','cardrole',p.animal?`${p.animal.species} / ${p.animal.breed||p.animal.coat||''}`:`${p.role||'居民'} · ${sex(p.sex)}`),node('p','carddesc',p.appearance||p.animal?.coat||p.persona?.personality||''));const foot=node('div','cardfoot');foot.append(node('span','',`${x.actions.filter(a=>a.gif).length} 种动作 · ${(p.presets||[]).length} 套预设`),node('span','arrow','打开档案 ↗'));body.append(foot);card.append(box,body);card.onclick=()=>open(x);grid.append(card)}if(!filtered.length)grid.append(node('p','empty','没有找到匹配的档案，试试其他关键词。'))}
function option(select,value,label){const o=node('option','',label);o.value=value;select.append(o)}
function open(x){active=x;playing=false;$('dgroup').textContent=GROUPS[x.group];$('detailTitle').textContent=x.profile.name;$('did').textContent=x.id;$('identity').textContent=identity(x);$('action').replaceChildren();option($('action'),'','静态头像');for(const a of x.actions.filter(a=>a.gif))option($('action'),a.id,ACTIONS[a.id]||a.id);if(x.overview)option($('action'),'__overview','全部动作总览');$('preset').replaceChildren();for(const [i,p]of (x.profile.presets||[]).entries())option($('preset'),i,p.label||p.id||`预设 ${i+1}`);if(!$('preset').options.length)option($('preset'),'0','默认设定');const links=$('links');links.replaceChildren();for(const [label,url]of [['完整档案 MD',x.profileMd],['动画清单',x.animationJson],['全部动作 GIF',x.overview]])if(url){const a=node('a','',label+' ↗');a.href=url;a.target='_blank';links.append(a)}$('missing').textContent=x.missingActions.length?`当前缺少专门动作：${x.missingActions.map(a=>ACTIONS[a]||a).join('、')}。转向观察帧不会替代真实步态。`:(x.group==='mini'?'沿用原桌宠的真实姿势与节奏；角色身份保留原设计。':'连续动作由分区骨骼近似生成，适合预览和原型运行；精细接触、遮挡与步态仍可继续手工打磨。');updateMotion();updatePreset();$('detail').showModal();$('close').focus()}
function identity(x){const p=x.profile;if(p.animal){const a=p.animal;return `${a.species} · ${a.breed||'品种未指定'} · ${a.coat||''} · ${a.bodySize||''}体型。${a.senses||''} ${a.locomotion||''} 仅使用自然声音与身体姿态。`}return `${sex(p.sex)} · ${p.role||'小镇访客'}。${p.appearance||p.persona?.personality||''}${x.group==='mini'?' 原有 Q 版人形 / 幻想桌宠，作为剧情身份加入。':''}`}
function updateMotion(){if(!active)return;const id=$('action').value,a=active.actions.find(a=>a.id===id),gif=id==='__overview'?active.overview:a?.gif;const path=playing&&gif?gif:active.portrait;portrait($('motion'),path,`${active.profile.name} ${playing?(ACTIONS[id]||'动作总览'):'静态头像'}`);$('play').textContent=playing?'暂停':'播放';$('play').disabled=!gif;if(a){const duration=a.durations?a.durations.reduce((x,y)=>x+y,0):a.frames*a.frameMs;$('actionmeta').textContent=`${a.frames} 帧 · ${(duration/1000).toFixed(2)} 秒 / 周期 · ${a.loop?'循环动作':'事件动作'}${a.durations?' · 原帧变时长':''}`}else $('actionmeta').textContent=id==='__overview'?'总览按动作逐段展示，单动作请使用左侧选择器。':'当前显示静态 PNG。选择动作后点击播放。'}
function field(parent,label,value){if(value===undefined||value===null||value==='')return;const f=node('div','field');f.append(node('strong','',label),node('p','',text(value)));parent.append(f)}
function updatePreset(){const p=active.profile,pre=(p.presets||[])[Number($('preset').value)]||p.persona||{},bio=$('biography');bio.replaceChildren();field(bio,p.animal?'物种 / 品种':'身份 / 职业',p.animal?[p.animal.species,p.animal.breed]:pre.role||p.role);field(bio,p.animal?'生活环境':'背景',pre.background||p.persona?.background);field(bio,p.animal?'个体气质':'性格',pre.personality||p.persona?.personality);field(bio,p.animal?'自然行为':'兴趣 / 行为偏好',pre.interests||p.persona?.interests);field(bio,p.animal?'自然信号':'交流方式',pre.speech||p.persona?.speech);field(bio,'主要地点',pre.workplace||pre.preferredPlaces||p.animal?.habitat);field(bio,'职业行为',pre.occupationalBehaviors);const section=$('schedule');section.replaceChildren();const rows=pre.schedule||p.schedule||[];if(rows.length){section.append(node('h3','sectionlabel','日常作息参考'));const t=node('table'),head=node('thead'),tr=node('tr');for(const s of ['时间','地点与行为'])tr.append(node('th','',s));head.append(tr);t.append(head);const tbody=node('tbody');for(const r of rows){const row=node('tr');row.append(node('td','',r.start?`${r.start}–${r.end}`:r.time||r.period||'日常'),node('td','',(r.location?r.location+' · ':'')+(r.behavior||r.activity||r.action||'')));tbody.append(row)}t.append(tbody);section.append(t)}if(p.animal){field(section,'生物视角',p.animal.senses);field(section,'行为特征',p.animal.behavior)}}
$('search').addEventListener('input',render);$('species').addEventListener('change',()=>{if($('species').value)group='animals';filterButtons();render()});$('action').addEventListener('change',()=>{playing=false;updateMotion()});$('play').onclick=()=>{playing=!playing;updateMotion()};$('preset').onchange=updatePreset;$('close').onclick=()=>{playing=false;active=null;$('motion').replaceChildren();$('detail').close()};$('detail').addEventListener('close',()=>{playing=false;active=null;$('motion').replaceChildren()});$('detail').addEventListener('click',e=>{if(e.target===$('detail')){const r=$('detail').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('detail').close()}});for(const s of [...new Set(DATA.map(x=>x.profile.animal?.species).filter(Boolean))].sort())option($('species'),s,s);$('total').textContent=DATA.length;filterButtons();render();
</script></body></html>
