</style><header><div><h1>溪畔日常</h1><p>九区汇合 / 完整小镇 / 三维场景 V1</p></div><span>住宅 · 街巷 · 广场 · 河流</span></header><main><section id="canvas"><div id="caption">小镇全景</div><div id="status">正在载入完整小镇…</div><button id="reset">重置视角</button></section><aside><h2 id="name">九个片区，一个小镇</h2><p id="description"></p><div class="eyebrow">选择片区</div><button class="all" data-zone="all">完整小镇</button><div class="grid"><button data-zone="A">A 花园住宅</button><button data-zone="B">B 公共服务</button><button data-zone="C">C 河畔住宅</button><button data-zone="D">D 手作工坊</button><button data-zone="E">E 中央广场</button><button data-zone="F">F 河岸公园</button><button data-zone="G">G 田园温室</button><button data-zone="H">H 日常商业</button><button data-zone="I">I 到达守护</button></div><div class="eyebrow">查看空间</div><div class="grid views"><button data-view="exterior">外观</button><button data-view="plan">俯视</button><button data-view="interior">剖切</button></div><label class="check">显示屋顶<input id="roof" type="checkbox" checked></label><label class="check">只看当前片区<input id="isolate" type="checkbox"></label><label class="check">剖切层 <span id="floor-value">1 层</span><input id="floor" type="range" min="1" max="5" value="1"></label><label class="check">显示区块标注<input id="labels" type="checkbox" checked></label><label class="check">广场市集<input id="market" type="checkbox" checked></label><label class="check">中央大树树冠<input id="canopy" type="checkbox" checked></label><label class="check">自动旋转<input id="auto" type="checkbox"></label><div class="facts"><div><span>完整范围</span><b>300 × 225 m</b></div><div><span>已整合区块</span><b>A— I · 9 区</b></div><div><span>居民住宅</span><b>46 户 + 主角 1 户</b></div><div><span>旅店与跨河桥</span><b>6 间客房 · 2 座桥</b></div></div><div class="legend">北：住宅与公共服务<br>中：工坊、广场与河岸公园<br>南：田园、商店与到达区<br>东：贯通南北的河流和自然步道</div><div class="actions"><button id="download">下载整体 GLB</button><button id="capture">保存当前图片</button><a class="link" href="Town-complete.blend" download>Blender 工程</a><a class="link" href="整镇分区总图.svg" target="_blank">中文平面图</a></div>
