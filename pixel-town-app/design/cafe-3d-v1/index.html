<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>溪畔咖啡厅 · 3D 模型</title><style>
*{box-sizing:border-box}body{margin:0;background:#e9e7dd;color:#344c40;font-family:"PingFang SC","Microsoft Yahei",sans-serif}header{height:92px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;border-bottom:1px solid #c9cfc1}h1{font-family:"Songti SC",serif;font-size:26px;font-weight:500;margin:0 0 5px;letter-spacing:3px}header p{margin:0;font-size:11px;letter-spacing:1px;color:#738171}.meta{font-size:12px;text-align:right;line-height:1.8}main{display:grid;grid-template-columns:minmax(0,1fr) 265px;height:calc(100dvh - 92px)}.canvas-wrap{position:relative;min-width:0;min-height:480px}#viewport{position:absolute;inset:0}canvas{display:block;touch-action:none}.view-label{position:absolute;top:24px;left:25px;font-size:12px;letter-spacing:2px;pointer-events:none}.view-label span{display:block;color:#7b8779;font-size:10px;margin-top:7px;letter-spacing:1px}.bottom{position:absolute;bottom:22px;left:25px;right:25px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:11px;color:#6b7a6a;pointer-events:none}.bottom button{pointer-events:auto}.panel{padding:27px 23px;background:#f5f3eb;border-left:1px solid #c9cfc1;overflow:auto}.panel h2{font-family:"Songti SC",serif;font-size:22px;font-weight:500;margin:0 0 9px}.panel p{font-size:12px;line-height:1.9;color:#71806f}.label{font-size:10px;letter-spacing:2px;color:#7e8976;margin:25px 0 10px}.views{display:grid;grid-template-columns:1fr 1fr;gap:6px}button{font:inherit;font-size:12px;border:1px solid #c5ccbd;border-radius:3px;background:transparent;color:#4a604c;padding:10px 12px;cursor:pointer}button:hover{background:#e4e9dc}button[aria-pressed=true]{background:#536c56;color:#fff;border-color:#536c56}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #b68a58;outline-offset:3px}.option{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin:16px 0}input{accent-color:#557154;width:17px;height:17px}.facts{border-top:1px solid #d6dacd;margin-top:24px;padding-top:8px}.facts div{display:flex;justify-content:space-between;font-size:11px;margin:13px 0}.facts strong{font-weight:500}.swatches{display:flex;gap:7px}.swatches i{width:27px;height:27px;border-radius:50%;border:1px solid #0001}.actions{display:grid;gap:7px;margin-top:22px}.primary{background:#536c56;color:#fff}.primary:hover{background:#455b47}.footnote{font-size:10px!important;color:#84907e!important}.panel a{color:#526d50;font-size:11px}body.night .view-label,body.night .bottom{color:#e0dcc6}@media(max-width:800px){header{padding:0 18px;height:82px}.meta{display:none}main{height:auto;grid-template-columns:1fr}.canvas-wrap{height:65dvh;min-height:400px}.panel{border-left:0;border-top:1px solid #c9cfc1;padding:22px}.views{grid-template-columns:repeat(4,1fr)}.panel p{max-width:600px}.view-label{left:18px;top:17px}.bottom{left:18px;bottom:15px;font-size:10px}.bottom #status{max-width:230px}.label{margin-top:20px}h1{font-size:23px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body><header><div><h1>溪畔咖啡厅</h1><p>小镇建筑工坊 / H01 / 第一版 3D 模型</p></div><div class="meta">木、陶土与一杯咖啡<br>建筑外观 ＋ 室内空间</div></header><main><section class="canvas-wrap" aria-label="可旋转的咖啡厅三维模型"><div id="viewport"></div><div class="view-label"><b id="view-name">完整外观</b><span>H01 — CREEKSIDE CAFE</span></div><div class="bottom"><span id="status" role="status">正在加载 3D 模型…</span><button id="reset">重置视角</button></div></section><aside class="panel"><h2>街角，慢一点。</h2><p>绿框落地窗、陶土坡屋顶和木质吧台。推门后看见咖啡制作，也能找个靠窗的位置坐下。</p><div class="label">查看模型</div><div class="views"><button data-view="exterior" aria-pressed="true">完整外观</button><button data-view="cutaway" aria-pressed="false">室内剖切</button><button data-view="top" aria-pressed="false">俯视布局</button><button data-view="counter" aria-pressed="false">吧台近景</button></div><div class="label">展示选项</div><label class="option">显示屋顶<input type="checkbox" id="roof" checked></label><label class="option">傍晚灯光<input type="checkbox" id="night"></label><label class="option">自动旋转<input type="checkbox" id="rotate"></label><div class="facts"><div><span>建筑占地</span><strong>18 × 9 m</strong></div><div><span>建筑高度</span><strong>约 5.9 m</strong></div><div><span>座位数量</span><strong>室内 18 / 露台 4</strong></div><div><span>工作区域</span><strong>吧台 / 备餐 / 储物</strong></div><div><span>配套空间</span><strong>卫生间 / 后勤入口</strong></div></div><div class="label">材料配色</div><div class="swatches" aria-label="橡木、鼠尾草绿、陶土、奶油白"><i style="background:#ae7d4e" title="橡木"></i><i style="background:#536f5c" title="鼠尾草绿"></i><i style="background:#a75e43" title="陶土"></i><i style="background:#e8dfc8" title="奶油白"></i></div><div class="actions"><button id="export" class="primary">下载 3D 模型</button><button id="capture">保存当前视图</button></div><p class="footnote">GLB 通用模型，可继续在 Blender 等工具中编辑。当前为设计模型，人物和经营逻辑尚未接入。</p><a href="README.md">查看模型说明与尺寸约定</a></aside></main><script src="cafe.bundle.js"></script><script>document.querySelector('#night').addEventListener('change',e=>document.body.classList.toggle('night',e.target.checked));</script></body></html>
