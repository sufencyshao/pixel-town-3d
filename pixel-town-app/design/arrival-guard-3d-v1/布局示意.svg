t-size="11" text-anchor="middle">消防车</text><rect x="543.4" y="223.0" width="40.800000000000004" height="114.0" fill="#799282" stroke="none"/><text x="563.8" y="280" font-size="12" text-anchor="middle">候车棚</text><rect x="628.48" y="240.70000000000002" width="30.239999999999995" height="102.6" fill="#749080" stroke="none"/><text x="643.6" y="292" font-size="12" text-anchor="middle">小巴</text><text x="526.0" y="628" font-size="16" text-anchor="middle">消防前场</text><text x="526.0" y="665.2" font-size="12" text-anchor="middle">保持通畅</text><text x="244" y="469.6" font-size="13" text-anchor="middle">步行到旅店 / 商业街</text><circle cx="131.5" cy="334.0" r="5" fill="#3b6b57"/><circle cx="298.0" cy="565.0" r="5" fill="#3b6b57"/><circle cx="427.18" cy="678.4" r="5" fill="#3b6b57"/><circle cx="427.18" cy="604.6" r="5" fill="#3b6b57"/><text x="790" y="162" font-size="23" text-anchor="start">空间安排</text><text x="790" y="205" font-size="15" text-anchor="start">01  西北 · 溪畔旅店</text><text x="790" y="236" font-size="15" text-anchor="start">一层接待、早餐与休息，二层6间客房。</text><text x="790" y="267" font-size="15" text-anchor="start">各客房配独立卫浴，走廊连接双跑楼梯。</text><text x="790" y="298" font-size="15" text-anchor="start"></text><text x="790" y="329" font-size="15" text-anchor="start">02  东北 · 公交候车</text><text x="790" y="360" font-size="15" text-anchor="start">小巴停靠、遮雨棚、长椅和站牌。</text><text x="790" y="391" font-size="15" text-anchor="start">乘客沿西侧步道进入旅店与商业街。</text><text x="790" y="422" font-size="15" text-anchor="start"></text><text x="790" y="453" font-size="15" text-anchor="start">03  南侧 · 消防值守</text><text x="790" y="484" font-size="15" text-anchor="start">两个东向车库位，一辆静态展示消防车。</text><text x="790" y="515" font-size="15" text-anchor="start">出车前场与北侧公交停靠区分设。</text><text x="790" y="604" font-size="22" text-anchor="start">步道衔接</text><text x="790" y="646" font-size="16" text-anchor="start">西 → 商业街</text><text x="790" y="680" font-size="16" text-anchor="start">北 → 河岸公园</text><text x="790" y="714" font-size="16" text-anchor="start">南 → 镇外车辆入口</text><text x="790" y="748" font-size="16" text-anchor="start">西侧步道绕过消防前场</text><text x="790" y="824" font-size="20" text-anchor="start">坐标与交付边界</text><text x="790" y="860" font-size="13" text-anchor="start">总图中心 (932.5, 830)，4 图纸单位 / 米。</text><text x="790" y="888" font-size="13" text-anchor="start">附加7 m南侧道路用于展示入口衔接。</text><text x="790" y="916" font-size="13" text-anchor="start">静态场景；车辆运行与人物行为待接入。</text><text x="672.4" y="904" font-size="15" text-anchor="middle">南 · 镇外入口</text><text x="70" y="992" font-size="13" text-anchor="start">2026-10-14 / I区模型布局示意 / 不作为施工图</text></g></svg>