<text x="70" y="793" class="label">北排：咖啡、烘焙、家常餐饮；南排：日常采购、花艺与理发。</text><text x="70" y="826" class="label">保留六栋原规划中心；咖啡厅按原尺寸纳入，后门连接独立收货步道。</text><text x="70" y="859" class="label">同一工程含六店室内、店前外摆、自然花灌木、树荫座椅及四向区块接口。</text><text x="70" y="897" class="small">静态设计 V1 / 2026-10-15 / 待视觉反馈；整镇装配、营业逻辑、人物行为、碰撞与寻路尚未接入</text></svg>