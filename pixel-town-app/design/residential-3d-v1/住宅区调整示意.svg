="middle">8 户</text><rect x="617.425" y="276.85" width="135.0" height="91.80000000000001" rx="3" fill="#eaf0dc" stroke="#b4c19f"/><rect x="625.525" y="293.05" width="118.80000000000001" height="59.400000000000006" rx="3" fill="#a8bcae" stroke="#748c75"/><text x="684.925" y="320.75" font-size="12" text-anchor="middle">C04 · 4 层</text><text x="684.925" y="338.75" font-size="11" text-anchor="middle">8 户</text><rect x="617.425" y="168.85" width="135.0" height="91.80000000000001" rx="3" fill="#eaf0dc" stroke="#b4c19f"/><rect x="625.525" y="185.05" width="118.80000000000001" height="59.400000000000006" rx="3" fill="#a8bcae" stroke="#748c75"/><text x="684.925" y="212.75" font-size="12" text-anchor="middle">C05 · 5 层</text><text x="684.925" y="230.75" font-size="11" text-anchor="middle">10 户</text><rect x="763.225" y="282.25" width="124.2" height="81.0" rx="3" fill="#c5d5b8"/><text x="825.325" y="322.75" font-size="13" text-anchor="middle">河景共享庭院</text><rect x="914.25" y="154" width="14" height="337.5" rx="3" fill="#d6d1be"/><rect x="938.25" y="154" width="62" height="337.5" rx="3" fill="#acd0cf"/><text x="969.25" y="322.75" font-size="20" text-anchor="middle">河</text><text x="969.25" y="350.75" font-size="20" text-anchor="middle">流</text><text x="610" y="516.5" font-size="13" text-anchor="start">区块 53.75 × 62.5 m · 示意北上</text><text x="45" y="565" font-size="20" text-anchor="start">容量核对</text><text x="45" y="596" font-size="15" text-anchor="start">现有角色库：40 位常规居民 + 5 位伙伴；若都独立入住，需要 45 户。</text><text x="45" y="623" font-size="15" text-anchor="start">庭院 6 户 + 公寓 2 × (3 + 4 + 4 + 4 + 5) = 46 户，余 1 户；主角另设 1 户。</text><text x="45" y="654" font-size="14" text-anchor="start">本轮调整：庭院住宅由每栋 4 户改为独户别墅；河畔公寓由 3 栋改为 5 栋，采用三种层数。</text><text x="45" y="681" font-size="13" text-anchor="start">采用原总图 A、C 区块范围检查地块容纳；户主未绑定。入口朝向、日照和完整路网仍需总图阶段联审。</text></svg>